<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Conexão • MACDP App</title>
  <style>
    body {
      background-color: #0B1120;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      padding: 2rem;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #F59E0B;
    }
    p {
      color: #94A3B8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/logo.png" alt="MACDP Logo">
    <h1>Modo Offline</h1>
    <p>Você está temporariamente sem conexão com a internet. O conteúdo salvo previamente continuará disponível assim que a rede for restabelecida.</p>
    <button onclick="window.location.reload()">Tentar Novamente</button>
  </div>
</body>
</html>
